name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Build & Validate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    env:
      APP_KEY: base64:rMEtTQWRHiPU8es+BE5TrmwrvWsUTVnl5ndnB1cDOIk=
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_WRITE_HOST: 127.0.0.1
      DB_WRITE_PORT: 5432
      DB_REPLICA_HOST: 127.0.0.1
      DB_REPLICA_PORT: 5432
      DB_DATABASE: nexora_test
      DB_USERNAME: saas
      DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'secret' }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ${{ env.DB_DATABASE }}
          POSTGRES_USER: ${{ env.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U saas -d nexora_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, bcmath, mbstring, intl, zip, sockets
          coverage: none
          tools: composer:v2

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Project Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate --env=testing

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Code Quality Checks & Tests
        run: composer code-shield