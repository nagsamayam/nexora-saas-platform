name: Build and Publish Nginx Image Only

on:
  push:
    branches:
      - main
    paths:
      - 'docker/nginx/**'
      - '.github/workflows/deploy-nginx.yml'
    tags:
      - 'nginx-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-nginx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Nginx is incredibly lightweight to build, so Buildx handles multi-platform emulation directly inside a single step
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ FIXED: Securely computes the lowercase repository name globally
      - name: Inject Slug Environment Variables
        run: |
          echo "REPO_LOWER=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
      
      # Automatically extracts semantic tags and git metadata
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ✅ FIXED: Swapped out raw github.repository for your safe REPO_LOWER variable
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/nginx
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            
            # ✅ FIXED: Uses regex matching to parse 'nginx-v1.0.2' -> cleanly outputs version '1.0.2' without warnings
            type=match,pattern=nginx-v(\d+\.\d+\.\d+),group=1
            # ✅ FIXED: Extracts only Major.Minor digits -> outputs '1.0' tracking family
            type=match,pattern=nginx-v(\d+\.\d+),group=1

      # 🌐 Build & Push Custom Nginx Image
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          # Compiles for both Intel and Apple Silicon/ARM processors out of the box
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
