name: Build and Publish PHP App Image Only

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docker/nginx/**'
      - '.github/workflows/deploy-nginx.yml'
    tags:
      - 'app-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==============================================================================
  # JOB 1: Build Architectures in Parallel NATIVELY
  # ==============================================================================
  build-manifest-chunks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest       # 🖥️ Intel code executes on native Intel servers
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    
    # 🌟 DYNAMICALLY SCALE RUNNERS BY ARCHITECTURE
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject Casing Variables
        run: |
          echo "REPO_LOWER=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Prepare Platform Variant Suffix
        id: platform_string
        run: |
          PLATFORM_STR="${{ matrix.platform }}"
          echo "variant=${PLATFORM_STR//\//-}" >> $GITHUB_OUTPUT

      # Build and push natively on the native matching runner hardware
      - name: Build and Push Platform Chunk
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/app,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_ENV=production
            APP_DEBUG=false
          cache-from: type=gha,scope=${{ steps.platform_string.outputs.variant }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform_string.outputs.variant }}

      - name: Export Digest Configuration
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform_string.outputs.variant }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ==============================================================================
  # JOB 2: Stitch Chunks Together into One Combined Version Tag
  # ==============================================================================
  merge-manifests:
    runs-on: ubuntu-latest
    needs: build-manifest-chunks
    permissions:
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Download pieces built natively across both separate servers
      - name: Download All Platform Digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      # Compute lowercase directory target
      - name: Inject Casing Variables
        run: |
          echo "REPO_LOWER=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # EXTRACT DOCKER METADATA
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=match,pattern=app-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=app-v(\d+\.\d+),group=1

      - name: Create Multi-Platform Manifest and Push
        run: |
          # Convert repository name to lowercase safely
          REPO_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Safely stitch the platform chunks into a perfect space-separated text string
          DIGESTS=$(ls /tmp/digests | xargs -I {} echo "${{ env.REGISTRY }}/${REPO_LOWER}/app@sha256:{}" | xargs)
          
          echo "Merging the following platform digests: $DIGESTS"
          
          # Read the tags multi-line block cleanly to prevent syntax parsing crashes
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Stitching manifest for tag: $tag"
              docker buildx imagetools create -t "$tag" $DIGESTS
            fi
          done
