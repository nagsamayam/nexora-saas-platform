# ==============================================================================
# LOCAL DEVELOPMENT OVERRIDES
# Automatically merged with docker-compose.yml when running `docker compose up`
# ==============================================================================

services:
  nginx:
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  app:
    volumes:
      - ./:/var/www/html
      - ./docker/php/zzz-dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini

  queue-worker:
    volumes:
      - ./:/var/www/html
      - ./docker/php/zzz-dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini

  redis:
    # Expose to localhost only for local GUI tools (e.g. TablePlus, RedisInsight)
    ports:
      - "127.0.0.1:6379:6379"

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: saas-cloudbeaver
    restart: unless-stopped
    ports:
      - "127.0.0.1:8978:8978"
    environment:
      CLOUDBEAVER_ROOT_URI: /cloudbeaver/
    volumes:
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace
    networks:
      - backend-net
    depends_on:
      pg_master:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8978/cloudbeaver/ || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

volumes:
  cloudbeaver_workspace:
