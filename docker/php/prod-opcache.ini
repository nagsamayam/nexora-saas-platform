[PHP]
; ---------------------------------------------------------
; Modern & Robust PHP 8.4+ Production Configuration
; Optimized for Laravel
; ---------------------------------------------------------

; Performance & Resource Limits
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 60
max_input_time = 60

; Realpath cache (Optimized for large frameworks like Laravel)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Error Handling (Log everything for audit, show nothing to users)
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Security & Integrity
expose_php = Off
zend.assertions = -1
short_open_tag = Off

; Session Security
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_trans_sid = 0

; Globalization
date.timezone = UTC

; OPcache (Peak performance for Laravel)
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
; Using a prime number for max_accelerated_files is a common optimization
opcache.max_accelerated_files = 32531
opcache.max_wasted_percentage = 10

; Production: Disable timestamp validation for maximum speed
; Code changes require a container/PHP-FPM restart
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Enable comment saving for Laravel's dependency injection and routing
opcache.save_comments = 1

; JIT (PHP 8.0+)
opcache.jit = tracing
opcache.jit_buffer_size = 128M
