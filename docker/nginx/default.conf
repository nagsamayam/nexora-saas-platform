# Upstream configuration for load balancing flexibility and cleaner aliases
upstream app {
    server app:9000;
}

upstream rabbitmq_dashboard {
    server rabbitmq:15672;
}

upstream cloudbeaver {
    server cloudbeaver:8978;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    # Security: Hide Nginx version structure
    server_tokens off;

    # 🚀 API Payload Limit: Restrict file uploads to 20MB to protect your server
    client_max_body_size 20M;

    # Logging: Standardize format for centralized logging aggregates (Datadog, ELK, etc)
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # 🛡️ Modernized Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy (Adjust this based on asset dependencies)
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    index index.php;
    charset utf-8;

    # Dynamic Gzip Compression (Optimized types list)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss image/svg+xml;

    # Laravel Routing Context
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 🐇 Secure Reverse Proxy for RabbitMQ Management Panel
    # Allows tracking traffic securely via http://your-ip/rabbitmq
    location ^~ /rabbitmq {
        proxy_pass http://rabbitmq_dashboard; # 🌟 Removed trailing slash and rewrite rules
        proxy_buffering off;                  # 🌟 Recommended for real-time socket connections
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;     # Uses http_host to preserve internal structural domains
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /cloudbeaver {
        return 301 /cloudbeaver/;
    }

    location ^~ /cloudbeaver/ {
        proxy_pass http://cloudbeaver;

        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /cloudbeaver;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }


    # Optimized Static Assets Caching & Asset Isolation
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 365d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # FastCGI Processing context mapping PHP execution
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass app;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Strict Header Cleanups
        fastcgi_hide_header X-Powered-By;

        # 🌟 FastCGI Buffering Safeguards (Prevents 502 Bad Gateway under enterprise load)
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;

        # Timeout allowances for resource intensive background requests
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # Block access to hidden system/vcs configurations
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
