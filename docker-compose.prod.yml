# ==============================================================================
# PRODUCTION COMPOSE SPECIFICATION
# Run with: docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

networks:
  backend-net:
    driver: bridge
    internal: true
  frontend-net:
    driver: bridge
    internal: false

volumes:
  postgres_master_data:
  postgres_replica_data:
  redis_data:
  rabbitmq_data:

services:
  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/nagsamayam/nexora-saas-platform/nginx:latest}
    container_name: saas-nginx-prod
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      app:
        condition: service_started
    networks:
      - backend-net
      - frontend-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  app:
    image: ${APP_IMAGE:-ghcr.io/nagsamayam/nexora-saas-platform/app:latest}
    container_name: saas-app-prod
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: pg_master
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    depends_on:
      pg_master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep php-fpm | grep -v grep"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  queue-worker:
    image: ${APP_IMAGE:-ghcr.io/nagsamayam/nexora-saas-platform/app:latest}
    container_name: saas-queue-worker-prod
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: pg_master
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      LARAVEL_DEFAULT_QUEUE: ${RABBITMQ_QUEUE:-default}
      LARAVEL_QUEUE_COMMAND: work
    command: >
      sh -c "until nc -z -v -w3 rabbitmq 5672; do
               echo 'Waiting for RabbitMQ broker to accept traffic...';
               sleep 3;
             done;
             echo 'RabbitMQ is online! Booting Laravel production asynchronous worker...';
             php artisan queue:work rabbitmq --queue=$${LARAVEL_DEFAULT_QUEUE} --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000 --memory=128 --timeout=90"
    depends_on:
      pg_master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[q]ueue:work' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:8-alpine
    container_name: saas-redis-prod
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: saas-rabbitmq-prod
    restart: always
    expose:
      - 5672
      - 15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  pg_bouncer:
    image: edoburu/pgbouncer:latest
    container_name: saas-pg-bouncer-prod
    restart: always
    environment:
      - DB_HOST=pg_master
      - DB_PORT=5432
      - DB_USER=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_DATABASE:-laravel_prod}
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - ADMIN_USERS=${DB_USERNAME:-postgres}
      - TRACK_EXTRA_FLOAT_DIGITS=1
      - AUTH_TYPE=scram-sha-256
    networks:
      - backend-net
    depends_on:
      pg_master:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  pg_master:
    image: postgres:18-alpine
    container_name: saas-pg-master-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel_prod}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?POSTGRES_REPLICATION_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=5
      -c max_replication_slots=5
      -c hot_standby=on
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./docker/postgres/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  pg_replica:
    image: postgres:18-alpine
    container_name: saas-pg-replica-prod
    restart: always
    environment:
      PGUSER: ${POSTGRES_REPLICATION_USER:-replicator}
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?POSTGRES_REPLICATION_PASSWORD is required}
      PGHOST: pg_master
      POSTGRES_DB: ${DB_DATABASE:-laravel_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: >
      bash -c "
      set -e

      if [ -s \"$$PGDATA/PG_VERSION\" ]; then
        echo 'Data directory already synced. Booting up standby node...'
      else
        echo 'Data directory empty or uninitialized. Preparing syncing parameters...'
        rm -rf \"$$PGDATA\"/*

        until pg_isready -h pg_master -p 5432 -U $$PGUSER -d replication; do
          echo 'Waiting for pg_master replication channel to accept traffic...';
          sleep 2;
        done;
        echo 'Master is up! Syncing base backup...';

        pg_basebackup -h pg_master -D \"$$PGDATA\" -U \"$$PGUSER\" -vP -Fp -Xs -R --slot=laravel_replica_slot;
        echo 'Sync complete!';
      fi

      exec docker-entrypoint.sh postgres -c hot_standby=on
      "
    depends_on:
      pg_master:
        condition: service_healthy
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$PGUSER -d replication"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
